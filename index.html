<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Envelopes</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
        crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        [v-cloak] {
            display: none;
        }
    </style>
</head>
<body class="bg-orange" v-cloak>

<div class="container-fluid">
    <div class="mt-5">
        <h4 class="text-center">Можешь открывать по одному конверту в день</h4>
        <h5 class="text-center invisible" style="color: rgb(185, 177, 255)" ref="notification">Сегодня ты уже открыла
            конверт. Приходи завтра
        </h5>
    </div>
    <br>
    <div class="mt-2" v-for="(category, categoryIndex) of categories">
        <div class="row no-gutters align-items-center">
            <div class="col border-top" style="opacity: 50%"></div>
            <h5 class="col-auto mx-2 pb-1" style="opacity: 50%">{{category.title}}</h5>
            <div class="col border-top" style="opacity: 50%"></div>
        </div>
        <div class="text-center">
            <template v-for="(envelope, envelopeIndex) of category.envelopes">
                <div
                    class="d-inline-block envelope cursor-pointer"
                    @touchstart="$event.target.classList.add('jiggle')"
                    @touchend="$event.target.classList.remove('jiggle')"
                    @click="open(category, envelopeIndex)"
                    :style="getStyle(category, categoryIndex, envelopeIndex)"></div>
            </template>
        </div>
    </div>
</div>

<div class="modal fade" ref="modal">
    <div class="modal-dialog mt-5">
        <div class="modal-content">
            <div class="modal-body" style="background-color: #141225">
                {{selectedEnvelope}}
            </div>
            <div class="modal-footer py-0" style="background-color: #141225">
                <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>


<script
    src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
    integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
    crossorigin="anonymous"></script>
<script
    src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
    integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
    crossorigin="anonymous"></script>
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
    integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
    crossorigin="anonymous"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="main.js"></script>

</body>
</html>
